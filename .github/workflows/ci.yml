name: CI

on:
  push:
  pull_request:

jobs:
  sdk:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build:example

  native:
    name: Native Linux (${{ matrix.display }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        display: [x11, wayland]
    defaults:
      run:
        working-directory: deps/blinc_ts
    steps:
      - uses: actions/checkout@v7
        with:
          path: deps/blinc_ts
      - uses: actions/checkout@v7
        with:
          repository: project-blinc/blinc_abi
          ref: b4270a7c228150550fe2afb7957e21be1a2876a9
          path: deps/blinc_abi
      - uses: actions/checkout@v7
        with:
          repository: rayzor-blade/x-idl
          ref: 753610fd220dcfb5cce358e9418eadc48cb4562d
          path: deps/x-idl
      - uses: actions/checkout@v7
        with:
          repository: rayzor-blade/xgpu
          ref: 71c25d19b99ef9557e56b2ac13cfce2715e582dd
          path: deps/xgpu
      - uses: actions/checkout@v7
        with:
          repository: rayzor-blade/xwindow
          ref: 3be8f63ae997fc40b5f10c55801c18132a6050c2
          path: deps/xwindow
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: deps/blinc_ts/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: deps/blinc_ts/native -> target
          shared-key: native-linux
          cache-on-failure: true
      - name: Native window and software GPU dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev libx11-dev libxrandr-dev libxi-dev libxcursor-dev libudev-dev mesa-vulkan-drivers xvfb xauth openbox sway
      - run: npm ci
      - run: npm run build
      - run: npm run build:native
      - name: Generated bindings match the committed interfaces
        run: git diff --exit-code -- src/native/generated
      - name: GPU snapshots, ownership, idle wake and HMR
        env:
          NATIVE_TEST_DISPLAY: ${{ matrix.display }}
        run: bash scripts/test-linux-native.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-${{ matrix.display }}-diagnostics
          path: deps/blinc_ts/.blinc/
          if-no-files-found: error
          include-hidden-files: true
